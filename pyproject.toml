[project]
name = "databricks_spark_app"
version = "0.1.0"
description = "Starter kit for building and deploying Apache Spark applications on Databricks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11.8",
    "pydantic-settings>=2.10.1",
    "databricks-connect>=15.0.0",
    "setuptools>=80.9.0",
    "wheel>=0.45.1",
]

[project.scripts]
spark_app = "databricks_spark_app.pipeline:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
]
test = [
    "pytest>=8.0.0",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
exclude = [".venv", "build", "dist", "include"]

[tool.ruff.lint]
select = ["E", "W", "F", "I001", "RUF022", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/databricks_spark_app"]
